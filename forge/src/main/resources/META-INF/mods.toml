modLoader = "kotlinforforge"
loaderVersion = "${loaderVersionRange}"
#issueTrackerURL = ""
license = "${modLicense}"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${modName}"
authors = "${modAuthors}"
description = '''
${modDescription}
'''
logoFile = "logo.png"

[[dependencies.${modId}]]
modId = "forge"
type = "required"
versionRange = "${forgeVersionRange}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftVersion}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "${modId}.mixins.json"
